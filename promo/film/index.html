<!doctype html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>BR — Promotional Film</title>
    <style>
      @font-face { font-family: 'Noto Kufi Arabic'; font-weight: 300; src: url(../assets/fonts/NotoKufiArabic-300.ttf); }
      @font-face { font-family: 'Noto Kufi Arabic'; font-weight: 500; src: url(../assets/fonts/NotoKufiArabic-500.ttf); }
      @font-face { font-family: 'Noto Kufi Arabic'; font-weight: 700; src: url(../assets/fonts/NotoKufiArabic-700.ttf); }
      @font-face { font-family: 'Noto Kufi Arabic'; font-weight: 900; src: url(../assets/fonts/NotoKufiArabic-900.ttf); }
      @font-face { font-family: 'Sora'; font-weight: 200; src: url(../assets/fonts/Sora-200.ttf); }
      @font-face { font-family: 'Sora'; font-weight: 300; src: url(../assets/fonts/Sora-300.ttf); }
      @font-face { font-family: 'Sora'; font-weight: 600; src: url(../assets/fonts/Sora-600.ttf); }
      @font-face { font-family: 'Sora'; font-weight: 800; src: url(../assets/fonts/Sora-800.ttf); }

      html, body { margin: 0; background: #000; overflow: hidden; }
      #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
               transform-origin: 0 0; }
      #stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #overlay { position: absolute; inset: 0; pointer-events: none; color: #f2f3f5; }
      .t { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; opacity: 0;
           will-change: opacity, transform, filter; }
      .en { font-family: 'Sora', sans-serif; }
      .ar { font-family: 'Noto Kufi Arabic', sans-serif; direction: rtl; }

      .en-xl { top: 43%; font-weight: 200; font-size: 80px; line-height: 1; text-shadow: 0 0 40px rgba(255,255,255,.25); }
      .en-xl .rule { display: block; margin: 34px auto 0; height: 2px; background: #d11a2a; box-shadow: 0 0 12px #ff2a3a; }
      .ar-xl { top: 40%; font-weight: 700; font-size: 118px; line-height: 1.3; text-shadow: 0 0 40px rgba(255,255,255,.2); }
      .ar-xl-top { top: 8%; font-weight: 700; font-size: 112px; line-height: 1.3; }
      .ar-xl-bot { top: 24%; font-weight: 700; font-size: 112px; line-height: 1.3; color: #c9ccd3; }
      .mark { top: 70%; font-weight: 300; font-size: 40px; letter-spacing: 1.1em; padding-left: 1.1em; }
      .ar-sub { top: 76.5%; font-weight: 500; font-size: 52px; color: #dfe1e6; }
      .ar-year { top: 9%; font-weight: 700; font-size: 62px; }
      .ar-year::before, .ar-year::after { content: ''; display: inline-block; width: 90px; height: 2px;
           background: #c9ccd3; vertical-align: middle; margin: 0 34px; opacity: .6; }
      .hud { left: 110px; right: auto; text-align: left; font-weight: 600; font-size: 26px; letter-spacing: .32em;
             padding: 14px 26px 14px 54px; border-left: 2px solid rgba(255,255,255,.7);
             background: linear-gradient(90deg, rgba(20,22,28,.65), rgba(20,22,28,0)); }
      .hud::before { content: ''; position: absolute; left: 22px; top: 50%; width: 12px; height: 12px; margin-top: -6px;
             background: #ff2a3a; box-shadow: 0 0 14px #ff2a3a; }
      .hud-c { top: 16%; font-weight: 600; font-size: 30px; letter-spacing: .5em; padding-left: .5em; }
      .hud-c::before, .hud-c::after { content: ''; display: inline-block; width: 70px; height: 2px; background: #ff2a3a;
             vertical-align: middle; margin: 0 30px; box-shadow: 0 0 10px #ff2a3a; }
      .en-lg { top: 15%; font-weight: 300; font-size: 64px; letter-spacing: .34em; padding-left: .34em; }
      .en-num { top: 30%; font-weight: 800; font-size: 250px; line-height: 1; letter-spacing: .02em;
                background: linear-gradient(180deg, #ffffff 0%, #9da1aa 100%); -webkit-background-clip: text; color: transparent;
                filter: drop-shadow(0 0 30px rgba(255,255,255,.25)); }
      .side-l, .side-r { top: 14%; width: 50%; font-weight: 600; font-size: 34px; letter-spacing: .3em; }
      .side-l { left: 0; right: auto; } .side-r { left: 50%; right: auto; }
      .side-l .rule, .side-r .rule { display: block; margin: 18px auto 0; height: 2px; width: 120px; background: #ff2a3a;
             box-shadow: 0 0 10px #ff2a3a; }
      .div { top: 26%; right: 120px; left: auto; text-align: right; }
      .div .num { font-family: 'Sora'; font-weight: 200; font-size: 170px; line-height: 1; color: transparent;
                  -webkit-text-stroke: 2px rgba(255,255,255,.85); display: block; letter-spacing: .05em; }
      .div .name { font-family: 'Noto Kufi Arabic'; font-weight: 700; font-size: 68px; direction: rtl; display: block;
                   margin-top: 10px; }
      .div .rule { display: block; height: 3px; width: 160px; background: #ff2a3a; margin: 22px 0 0 auto;
                   box-shadow: 0 0 12px #ff2a3a; }
      .trio-0, .trio-1, .trio-2 { top: 16%; width: 33.3%; right: auto; font-weight: 200; font-size: 78px; letter-spacing: .22em; }
      .trio-0 { left: 0; } .trio-1 { left: 33.3%; } .trio-2 { left: 66.6%; }
      .recap { top: 14%; font-weight: 300; font-size: 58px; letter-spacing: .28em; padding-left: .28em; }
      .end-1 { top: 68%; font-weight: 300; font-size: 30px; letter-spacing: .8em; padding-left: .8em; color: #c9ccd3; }
      .end-2 { top: 72.5%; font-weight: 600; font-size: 30px; letter-spacing: .6em; padding-left: .6em; }
      .end-3 { top: 78%; font-weight: 300; font-size: 24px; letter-spacing: .5em; padding-left: .5em; color: #c9ccd3; }
      .end-4 { top: 82.5%; font-weight: 600; font-size: 20px; letter-spacing: .7em; padding-left: .7em; color: #8d9099; }
      .end-4::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #ff2a3a; margin: 0 26px 3px 0;
                       box-shadow: 0 0 10px #ff2a3a; }

      #captions { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; }
      #captions .cap { display: inline-block; font-family: 'Noto Kufi Arabic', sans-serif; direction: rtl; font-weight: 500;
             font-size: 42px; line-height: 1.55; color: #fff; padding: 8px 34px 12px; opacity: 0;
             text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.8);
             background: linear-gradient(90deg, rgba(0,0,0,0), rgba(0,0,0,.42) 18%, rgba(0,0,0,.42) 82%, rgba(0,0,0,0)); }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; }
    </style>
    <script type="importmap">
      { "imports": {
          "three": "../node_modules/three/build/three.module.js",
          "three/addons/": "../node_modules/three/examples/jsm/"
      } }
    </script>
  </head>
  <body>
    <div id="stage">
      <div id="overlay">
        <div id="titles"></div>
        <div id="captions"><span class="cap"></span></div>
      </div>
      <div id="flash"></div>
      <div id="fade"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
