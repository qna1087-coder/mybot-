<title>BR The Return</title>
<style>
/*@FONTS@*/
/* Layout: a single dark screening room, film stage on top, transport and chapters beneath. */
:root{
  --bg:#070708; --panel:#101114; --line:#24262c; --fg:#eceef2; --muted:#8b8f98; --red:#c01c29;
  --sans:"BRSans","IBM Plex Sans Arabic",system-ui,sans-serif; --mono:"BRMono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-family:var(--mono);font-weight:400;letter-spacing:.35em;font-size:13px;color:var(--fg)}
.brand span{font-weight:500;font-size:18px}
.meta{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--muted)}
.stage{position:relative;background:#000;border:1px solid var(--line);aspect-ratio:16/9;width:100%;max-width:100%;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.bigplay{position:absolute;inset:auto auto 22px 22px;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border:1px solid rgba(236,238,242,.35);background:rgba(7,7,8,.55);color:var(--fg);font:500 14px var(--sans);cursor:pointer;backdrop-filter:blur(6px)}
.bigplay:hover{border-color:var(--fg)}
.bigplay svg{width:18px;height:18px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controls button,.chapters button{background:var(--panel);color:var(--fg);border:1px solid var(--line);font:500 13px var(--sans);padding:7px 12px;cursor:pointer}
.controls button:hover,.chapters button:hover{border-color:var(--muted)}
.controls button[aria-pressed="false"]{color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#play{min-width:44px;display:grid;place-items:center}
#play svg{width:14px;height:14px}
#scrub{flex:1 1 220px;min-width:0;accent-color:var(--red)}
#tc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.chapters button{display:grid;gap:2px;text-align:start;padding:9px 12px}
.chapters button small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.chapters button.on{border-color:var(--red)}
.note{color:var(--muted);font-size:13px;max-width:70ch;margin:0}
#status{font-family:var(--mono);font-size:12px;color:var(--muted)}
body.render{margin:0;background:#000}
body.render .wrap{display:block;max-width:none;padding:0}
body.render .top,body.render .controls,body.render .chapters,body.render .note,body.render .bigplay{display:none}
body.render .stage{border:0;width:1920px;height:1080px;aspect-ratio:auto}
</style>

<main class="wrap" dir="rtl">
  <header class="top">
    <div class="brand"><b dir="ltr">BR</b><span>الحزب الإصلاحي — THE RETURN</span></div>
    <div class="meta" dir="ltr">01:30 · 16:9 · 24 FPS</div>
  </header>
  <section class="stage" id="stage" dir="ltr">
    <canvas id="film" aria-label="فيلم BR الترويجي"></canvas>
    <button class="bigplay" id="bigplay" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>شغّل الفيلم مع الصوت</button>
  </section>
  <div class="controls" dir="ltr">
    <button id="play" type="button" aria-label="تشغيل"><svg viewBox="0 0 16 16" aria-hidden="true"><path id="playicon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
    <input type="range" id="scrub" min="0" max="90" step="0.01" value="0" aria-label="موضع التشغيل">
    <span id="tc">00:00 / 01:30</span>
    <button id="cc" type="button" aria-pressed="true">الترجمة</button>
    <button id="snd" type="button" aria-pressed="true">الصوت</button>
    <button id="fs" type="button">ملء الشاشة</button>
    <span id="status" aria-live="polite"></span>
  </div>
  <nav class="chapters" id="chapters" aria-label="المشاهد"></nav>
  <p class="note">الموسيقى والمؤثرات الصوتية مولّدة داخل الصفحة. التعليق الصوتي معروض كترجمة متزامنة لحين تسجيله بصوت المعلّق.</p>
</main>

<script>
(()=>{
const W=1920,H=1080,DUR=90,FPS=24;
const HASH=location.hash;
const RENDER=/^#render/.test(HASH);
const cv=document.getElementById('film');const ctx=cv.getContext('2d');
let S=1,SA=1,CAPS_ON=true;
function setScale(s){S=s;const w=Math.round(W*s),h=Math.round(H*s);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}

/* ---------- math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo=t=>1-Math.pow(1-t,3);
const ei=t=>t*t*t;
const env=(t,a,b,c,d)=>Math.min(eo(seg(t,a,b)),1-ei(seg(t,c,d)));
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>{let h=Math.imul(a*374761393+b*668265263,1274126177);h^=h>>>13;return((h>>>0)%1000)/1000};

/* ---------- palette ---------- */
const C={ink:'#050506',graph:'#15161a',steel:'#8b8f98',silver:'#cfd3da',white:'#f3f5f8',red:'#c01c29',redHot:'#e3303c'};
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return`rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};

/* ---------- drawing helpers ---------- */
const AR=/[؀-ۿ]/;
function ga(a){ctx.globalAlpha=clamp(SA*a)}
function text(s,x,y,o={}){
  const a=o.alpha??1;if(a<=0.004)return;
  const rtl=AR.test(s);
  const size=o.size||40,weight=o.weight||500,align=o.align||'center';
  const track=rtl?0:(o.track||0);
  ctx.save();ga(a);
  ctx.font=`${weight} ${size}px ${o.mono?'"BRMono", monospace':'"BRSans", sans-serif'}`;
  ctx.textAlign=align;ctx.textBaseline=o.base||'middle';ctx.direction=rtl?'rtl':'ltr';
  ctx.letterSpacing=track+'px';
  if(align==='center')x+=track/2;else if(align==='right')x+=track;
  if(o.glow){ctx.shadowColor=o.glowColor||'rgba(255,255,255,.55)';ctx.shadowBlur=o.glow*S}
  ctx.fillStyle=o.color||C.white;ctx.fillText(s,x,y);
  ctx.restore();
}
function reveal(s,x,y,o,p){if(p<=0)return;text(s,x,y+(1-eo(p))*18,{...o,alpha:(o.alpha??1)*eo(p),track:(o.track||0)+(1-eo(p))*6})}
function glow(x,y,r,col,a){if(a<=0||r<=0)return;ctx.save();ga(a);ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}
function line(x1,y1,x2,y2,col,a,w=1){if(a<=0)return;ctx.save();ga(a);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function partial(x1,y1,x2,y2,p,col,a,w=1){if(p<=0)return;line(x1,y1,lerp(x1,x2,p),lerp(y1,y2,p),col,a,w)}
function rect(x,y,w,h,{fill=null,stroke=null,a=1,lw=1}={}){if(a<=0)return;ctx.save();ga(a);if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h)}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}ctx.restore()}
function dot(x,y,r,col,a){if(a<=0)return;ctx.save();ga(a);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.restore()}
function ring(x,y,r,col,a,w=1){if(a<=0)return;ctx.save();ga(a);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.stroke();ctx.restore()}

/* ---------- images & offscreen ---------- */
const IMG={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;r()};i.onerror=()=>r();i.src=src})}
const OFF={};
function off(key,w,h){let c=OFF[key];if(!c)c=OFF[key]=document.createElement('canvas');if(c.width!==w||c.height!==h){c.width=w;c.height=h}const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,w,h);return[c,x]}
function tinted(key,img,w,h,paint){const pw=Math.max(2,Math.round(w*S)),ph=Math.max(2,Math.round(h*S));const[c,x]=off(key,pw,ph);x.drawImage(img,0,0,pw,ph);x.globalCompositeOperation='source-in';paint(x,pw,ph);return c}
function metal(key,img,w,h,sweep,dormant){
  return tinted(key,img,w,h,(x,pw,ph)=>{
    const g=x.createLinearGradient(0,0,pw*.3,ph);
    g.addColorStop(0,'#f5f6f9');g.addColorStop(.36,'#babec6');g.addColorStop(.5,'#5d6169');g.addColorStop(.57,'#c8ccd3');g.addColorStop(1,'#8a8e96');
    x.fillStyle=g;x.fillRect(0,0,pw,ph);
    x.globalCompositeOperation='source-atop';
    if(sweep>-.2&&sweep<1.2){const sx=lerp(-.35,1.35,sweep)*pw;const sg=x.createLinearGradient(sx-pw*.16,0,sx+pw*.16,ph*.25);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.95)');sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(0,0,pw,ph)}
    if(dormant>0){x.fillStyle=`rgba(16,17,20,${dormant})`;x.fillRect(0,0,pw,ph)}
  });
}
function drawMark(img,key,cx,cy,h,o={}){
  if(!img)return;const a=o.alpha??1;if(a<=0.004)return;
  const w=h*img.width/img.height,yaw=o.yaw||0,depth=o.depth??14;
  const sx=Math.max(.06,Math.abs(Math.cos(yaw))),sn=Math.sin(yaw),ww=w*sx;
  if(o.glow)glow(cx,cy,h*1.25,'rgba(230,234,242,.35)',a*o.glow);
  const side=tinted(key+'s',img,w,h,(x,pw,ph)=>{x.fillStyle='#1b1d22';x.fillRect(0,0,pw,ph)});
  const edge=tinted(key+'e',img,w,h,(x,pw,ph)=>{x.fillStyle='#3a3d45';x.fillRect(0,0,pw,ph)});
  ctx.save();ga(a);
  const dx=.35+sn*1.1,dy=.55;
  for(let i=depth;i>=1;i--)ctx.drawImage(i===1?edge:side,cx-ww/2+dx*i,cy-h/2+dy*i,ww,h);
  ctx.drawImage(metal(key+'m',img,w,h,o.sweep??-1,o.dormant||0),cx-ww/2,cy-h/2,ww,h);
  ctx.restore();
}
const logo=(cx,cy,h,o)=>drawMark(IMG.br,'br'+(o&&o.slot||''),cx,cy,h,o);

/* ---------- global layers ---------- */
let GRAIN=[];
function makeGrain(){const r=rng(99);GRAIN=[0,1,2].map(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=r()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return c})}
function background(t){
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  const lift=0.55+0.45*seg(t,1,4);
  const g=ctx.createRadialGradient(W/2,H*.46,0,W/2,H*.46,W*.72);
  g.addColorStop(0,`rgba(26,27,32,${lift})`);g.addColorStop(1,'rgba(5,5,6,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.66);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function grain(t){if(!GRAIN.length)return;const f=Math.floor(t*FPS);const c=GRAIN[f%3];ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation='overlay';const p=ctx.createPattern(c,'repeat');ctx.translate(hash(f,1)*256,hash(f,2)*256);ctx.fillStyle=p;ctx.fillRect(-256,-256,W+512,H+512);ctx.restore()}

/* =====================================================================
   SCENE 1 — OPENING (0–8)
   ===================================================================== */
const DUST=(()=>{const r=rng(7);return Array.from({length:520},()=>({x:(r()-.5)*1900,y:(r()-.5)*1100,z:r()*1300,s:r()*1.5+.4,p:r()*6.28,red:r()<.04}))})();
function dust(t,level,cx,cy,speed=40){
  if(level<=0)return;ctx.save();
  for(const p of DUST){const z=((p.z-t*speed)%1300+1300)%1300+120;const k=760/z;const x=cx+p.x*k+Math.sin(t*.4+p.p)*8,y=cy+p.y*k+Math.cos(t*.3+p.p)*6;if(x<-10||x>W+10||y<-10||y>H+10)continue;const a=level*clamp(1.25-z/1300)*.55;const s=p.s*k*1.1;ga(a);ctx.fillStyle=p.red?C.redHot:C.silver;ctx.fillRect(x-s/2,y-s/2,s,s)}
  ctx.restore();
}
function sOpen(t){
  const push=lerp(.84,1,eio(seg(t,0,8.4)));
  const cx=W/2,cy=420;
  const beam=env(t,.4,1.1,4.4,6.8),grow=eo(seg(t,.4,1.6));
  if(beam>0){
    ctx.save();ctx.globalCompositeOperation='lighter';
    const yEnd=lerp(0,cy-150*push,grow);
    let g=ctx.createLinearGradient(0,0,0,yEnd);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.95)');
    ga(beam);ctx.fillStyle=g;ctx.fillRect(cx-1.2,0,2.4,yEnd);
    const cone=beam*eo(seg(t,1.3,2.8));
    if(cone>0){ctx.beginPath();ctx.moveTo(cx-5,0);ctx.lineTo(cx+5,0);ctx.lineTo(cx+470,H);ctx.lineTo(cx-470,H);ctx.closePath();
      g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(232,236,245,.2)');g.addColorStop(.42,'rgba(232,236,245,.075)');g.addColorStop(1,'rgba(232,236,245,0)');ga(cone);ctx.fillStyle=g;ctx.fill()}
    ctx.restore();
  }
  const lit=eo(seg(t,1.3,3.3));
  dust(t,lit*.9+.1,cx,cy,34);
  glow(cx,cy,420*push,'rgba(210,215,228,.22)',lit);
  logo(cx,cy,300*push,{alpha:lit,sweep:seg(t,1.8,3.9),glow:.6*lit,depth:16});
  // typography
  const ty=640;
  const a1=1-seg(t,5.0,5.4);
  reveal('B R',cx,ty-18,{mono:1,size:22,track:22,color:C.steel,alpha:a1},seg(t,3.0,3.7));
  reveal('الحزب الإصلاحي',cx,ty+42,{size:58,weight:500,alpha:a1},seg(t,3.3,4.1));
  const up=eo(seg(t,6.7,7.3));
  reveal('مو مجرد تيم.',cx,ty+18-up*22,{size:60,weight:300,color:C.silver,alpha:1-.62*up},seg(t,5.5,6.1));
  const pOrg=seg(t,6.9,7.5);
  reveal('منظمة.',cx,ty+112,{size:96,weight:700,glow:pOrg>0?14:0},pOrg);
  const ul=eo(seg(t,7.3,8.0));if(ul>0){ctx.save();ga(1);ctx.fillStyle=C.red;ctx.fillRect(cx-70*ul,ty+176,140*ul,4);ctx.restore()}
}

/* =====================================================================
   SCENE 2 — TIMELINE (8–25)
   ===================================================================== */
const DATES=[
  {y:'2022',z:0,cap:'نهاية 2022 — التأسيس',a:8.6,b:13.0},
  {y:'2023',z:100,cap:'2023 — بداية العمل',a:12.9,b:17.0},
  {y:'2024',z:200,cap:'2024 — تجميد المشروع',a:16.9,b:20.2},
  {y:'2025',z:300,cap:'',ghost:1},
  {y:'2026',z:400,cap:'THE RETURN',a:20.95,b:99},
];
function camZ(t){
  if(t<9.6)return lerp(-175,-42,eo(seg(t,7.8,9.6)));
  if(t<12.3)return lerp(-42,-34,seg(t,9.6,12.3));
  if(t<13.6)return lerp(-34,58,eio(seg(t,12.3,13.6)));
  if(t<16.3)return lerp(58,66,seg(t,13.6,16.3));
  if(t<17.5)return lerp(66,158,eio(seg(t,16.3,17.5)));
  if(t<20.0)return lerp(158,163,seg(t,17.5,20));
  if(t<21.0)return lerp(163,356,ei(seg(t,20,21)));
  return lerp(356,369,eo(seg(t,21,25.4)));
}
const CORR=(()=>{const r=rng(21);return Array.from({length:380},()=>({x:(r()-.5)*150,y:(r()-.5)*95,z:r()*900,red:r()<.05}))})();
function sTimeline(t){
  const cz=camZ(t),v=(camZ(t+.02)-camZ(t-.02))/.04,F=900;
  const P=(x,y,z)=>{const dz=z-cz;if(dz<1.2)return null;const s=F/dz;return[W/2+x*s,H/2+y*s,s,dz]};
  const dim=1-.5*env(t,17.0,18.0,20.3,20.9);
  // corridor dust / warp streaks
  ctx.save();
  for(const p of CORR){const dz=((p.z-cz)%900+900)%900+2;const a=P(p.x,p.y,cz+dz);if(!a)continue;const al=clamp(1-dz/900)*.6*dim;
    if(v>40){const b=P(p.x,p.y,cz+dz+Math.min(60,v*.04));if(!b)continue;ga(al*clamp(v/300+.2));ctx.strokeStyle=p.red?C.redHot:C.silver;ctx.lineWidth=Math.max(.6,a[2]*.12);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}
    else{ga(al);ctx.fillStyle=p.red?C.redHot:C.silver;const s=Math.max(1,a[2]*.12);ctx.fillRect(a[0],a[1],s,s)}}
  ctx.restore();
  // rails and spine
  const n0=P(0,14,cz+1.5),n1=P(0,14,cz+1000);
  if(n0&&n1){ctx.save();const g=ctx.createLinearGradient(n0[0],n0[1],n1[0],n1[1]);g.addColorStop(0,'rgba(207,211,218,.75)');g.addColorStop(1,'rgba(207,211,218,0)');ga(dim);ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(n0[0],n0[1]);ctx.lineTo(n1[0],n1[1]);ctx.stroke();ctx.restore()}
  for(const rx of[-58,58]){const a=P(rx,14,cz+1.5),b=P(rx,14,cz+1000);if(a&&b)line(a[0],a[1],b[0],b[1],C.steel,.14*dim)}
  // quarter ticks
  for(let q=Math.ceil((cz+2)/25);q*25<cz+700;q++){const z=q*25;const a=P(-2.2,14,z),b=P(2.2,14,z);if(!a||!b)continue;const fa=clamp(1-(a[3]-20)/600)*seg(a[3],3,14)*dim;line(a[0],a[1],b[0],b[1],C.silver,.5*fa,1.2);
    if(q%4!==0)text('Q'+(((q%4)+4)%4+1),b[0]+a[2]*1.2,b[1],{mono:1,size:Math.min(40,a[2]*1.1),color:C.steel,alpha:.55*fa,align:'left'})}
  // dates
  for(const d of DATES){
    const m=P(0,14,d.z);if(!m)continue;
    const dz=m[3],s=m[2],k=s/22.5;
    const far=Math.pow(clamp(1-(dz-40)/620),1.4)*(dz>62?.28:1),near=seg(dz,5,24);
    const vis=far*near;if(vis<=.01)continue;
    const act=d.ghost?0:env(t,d.a,d.a+.8,d.b-.6,d.b);
    const is26=d.y==='2026',is24=d.y==='2024';
    // marker
    const mcol=is26&&act>0?C.redHot:(is24?C.red:C.silver);
    dot(m[0],m[1],Math.max(2,.5*s),mcol,vis*(d.ghost?.25:.6+.4*act)*dim);
    ring(m[0],m[1],Math.max(4,1.3*s),C.silver,vis*.35*(d.ghost?.3:1)*dim,Math.max(1,.07*s));
    if(is24&&act>0)ring(m[0],m[1],1.3*s*(1+.4*((t*.8)%1)),C.red,vis*act*.5*(1-((t*.8)%1)),1.2);
    // year
    const n=P(-3.5,-1,d.z);
